[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cam-mcp"
version = "0.1.0"
description = "Physical camera perception, measurement, and verification tool for MCP AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SK Raihan", email = "skrelectronicslab@gmail.com" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "agentic-ai",
    "computer-vision",
    "webcam",
    "camera",
    "opencv",
    "vision",
    "hardware",
    "hardware-in-the-loop",
    "iot",
    "esp32",
    "robotics",
    "3d-printing",
    "cnc",
    "antigravity",
    "claude-code",
    "codex",
    "cursor",
    "developer-tools",
    "dashboard",
    "fastapi",
    "python"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware"
]

dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "opencv-python-headless>=4.8.0.76",
    "numpy>=1.24.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mqtt = ["paho-mqtt>=2.0.0"]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
all = [
    "pyserial>=3.5",
    "paho-mqtt>=2.0.0",
    "rapidocr-onnxruntime>=1.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "build>=1.1.0",
    "playwright>=1.42.0",
]

[project.scripts]
agent-cam-mcp = "agent_cam.cli:main"

[project.urls]
Homepage = "https://github.com/skr-electronics-lab/agent-cam-mcp"
Repository = "https://github.com/skr-electronics-lab/agent-cam-mcp"
Issues = "https://github.com/skr-electronics-lab/agent-cam-mcp/issues"
Changelog = "https://github.com/skr-electronics-lab/agent-cam-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cam"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
